# =============================================================================
# nginx reverse-proxy for the BitQube mining pool WEBSITE (EasyNOMP)
#
#   sudo cp pool.bitqube.org.conf /etc/nginx/sites-available/pool.bitqube.org.conf
#   sudo ln -sf /etc/nginx/sites-available/pool.bitqube.org.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d pool.bitqube.org   (or use a Cloudflare Origin cert)
#   sudo nginx -t && sudo systemctl reload nginx
#
# The EasyNOMP website runs plain HTTP on 127.0.0.1:8080 (config.json ->
# website.host/port, sslenabled:false). nginx terminates TLS in front of it.
# Serves on both :80 and :443 with NO forced redirect, so it is safe under the
# zone-wide Cloudflare "Flexible" mode (same setup as explorer.bitqube.org).
#
# IMPORTANT — STRATUM IS NOT PROXIED HERE:
#   Miners connect over RAW TCP to the stratum ports (10008 / 10032 / 10256),
#   NOT through nginx or Cloudflare. Point config.json "stratumHost" at a
#   DNS-ONLY (grey-cloud) hostname or the server's public IP, and open those
#   TCP ports in the firewall.  Cloudflare's proxy does not carry stratum TCP.
# =============================================================================

server {
    server_name pool.bitqube.org;

    listen 80;
    listen 443 ssl;

    access_log /var/log/nginx/pool.access.log;
    error_log  /var/log/nginx/pool.error.log;

    include /etc/nginx/conf.d/cloudflare-realip.conf; # restore real client IPs (if using Cloudflare)

    # Let's Encrypt cert (added by: sudo certbot --nginx -d pool.bitqube.org)
    ssl_certificate     /etc/letsencrypt/live/pool.bitqube.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pool.bitqube.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;  # websocket (live pool stats)
        proxy_set_header Connection        "upgrade";
    }
}
